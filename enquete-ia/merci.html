<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Merci pour votre retour</title><style>body{margin:0;font-family:Inter,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:linear-gradient(180deg,#eef4fb,#f8fafc);color:#122033;min-height:100vh;display:grid;place-items:center;padding:24px}.card{max-width:680px;background:white;border-radius:24px;padding:38px;box-shadow:0 18px 50px rgba(11,31,51,.12);text-align:center}h1{margin:0 0 14px;color:#0b1f33;font-size:clamp(2rem,5vw,3rem)}p{color:#667085;font-size:1.05rem;line-height:1.6;margin:0}.badge{display:inline-block;margin-bottom:18px;padding:8px 12px;border-radius:999px;background:#eaf2ff;color:#1d5fd1;font-weight:800;font-size:.9rem}</style></head><body><main class="card"><div class="badge">Réponse enregistrée</div><h1>Merci pour votre contribution</h1><p>Votre retour va m’aider à construire une formation IA réellement adaptée aux réalités et aux besoins des managers de transition. Si vous avez accepté un échange, je reviendrai vers vous pour convenir d’un créneau.</p></main></body></html>
